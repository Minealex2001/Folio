# Profile for Docker Compose / self-host stack.
# Hostnames match service names in backend/docker-compose.yml.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/folio}
    username: ${SPRING_DATASOURCE_USERNAME:folio}
    password: ${SPRING_DATASOURCE_PASSWORD:folio}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  mail:
    host: ${SPRING_MAIL_HOST:mailpit}
    port: ${SPRING_MAIL_PORT:1025}

folio:
  storage:
    endpoint: ${S3_ENDPOINT:http://minio:9000}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}
    bucket: ${S3_BUCKET:folio}
    region: ${S3_REGION:us-east-1}
    path-style-access: true
    bootstrap-bucket: ${S3_BOOTSTRAP_BUCKET:true}
  app:
    public-base-url: ${APP_PUBLIC_BASE_URL:http://127.0.0.1:18080}

logging:
  level:
    org.flywaydb: INFO
    com.folio.backend: INFO
