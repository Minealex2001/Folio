spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/folio}
    username: ${SPRING_DATASOURCE_USERNAME:folio}
    password: ${SPRING_DATASOURCE_PASSWORD:folio}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false

logging:
  level:
    org.flywaydb: INFO
    com.folio.backend: DEBUG
