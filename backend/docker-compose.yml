# Folio Cloud self-host stack (API + Postgres + MinIO + Mailpit).
# From repo root:
#   docker compose -f backend/docker-compose.yml --env-file backend/.env up -d --build
# Or from backend/:
#   copy .env.example .env   # then edit secrets
#   docker compose up -d --build
#
# Dev without API container (app via mvn): omit the api service with
#   docker compose up -d postgres minio mailpit

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: folio
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-folio}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U folio -d folio"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - folio_pg_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - folio_minio_data:/data

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: folio-api:local
    ports:
      # Host 18080 evita choque habitual en Windows: CEF/Cursor ocupa 127.0.0.1:8080
      # (Dart resuelve localhost→IPv4 y el registro devolvía 404 del debugger, no de Folio).
      - "${API_HOST_PORT:-18080}:8080"
    env_file:
      - path: .env
        required: false
    environment:
      # Profile + internal DNS (override localhost values from .env for host-side mvn runs)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker}
      SERVER_PORT: "8080"
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/folio
      SPRING_DATASOURCE_USERNAME: folio
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-folio}
      SPRING_MAIL_HOST: mailpit
      SPRING_MAIL_PORT: "1025"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-folio}
      S3_REGION: ${S3_REGION:-us-east-1}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-dev-only-change-me-to-a-long-random-secret-32b}
      MAIL_FROM: ${MAIL_FROM:-noreply@folio.local}
      APP_PUBLIC_BASE_URL: ${APP_PUBLIC_BASE_URL:-http://127.0.0.1:18080}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    restart: unless-stopped

volumes:
  folio_pg_data:
  folio_minio_data:
