<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Spotify · Folio</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      display: flex;
      min-height: 100vh;
      margin: 0;
      align-items: center;
      justify-content: center;
      background: #121212;
      color: #f5f5f5;
    }
    main { text-align: center; padding: 24px; max-width: 28rem; }
    h1 { font-size: 1.25rem; font-weight: 600; }
    p { color: #b3b3b3; line-height: 1.45; }
  </style>
</head>
<body>
  <main>
    <h1 id="title">Spotify</h1>
    <p id="msg">…</p>
  </main>
  <script>
    (function () {
      var params = new URLSearchParams(window.location.search);
      var payload = {
        type: "folio-spotify-oauth",
        code: params.get("code") || "",
        state: params.get("state") || "",
        error: params.get("error") || ""
      };
      var title = document.getElementById("title");
      var msg = document.getElementById("msg");
      if (payload.error) {
        title.textContent = "OAuth";
        msg.textContent = payload.error;
      } else {
        title.textContent = "OK";
        msg.textContent = "Folio";
      }
      try {
        localStorage.setItem("folio_spotify_oauth", JSON.stringify(payload));
      } catch (e) {}
      try {
        if (window.opener && !window.opener.closed) {
          window.opener.postMessage(payload, window.location.origin);
        }
      } catch (e) {}
      setTimeout(function () {
        try { window.close(); } catch (e) {}
      }, 500);
    })();
  </script>
</body>
</html>
