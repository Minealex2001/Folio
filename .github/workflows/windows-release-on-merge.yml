name: Windows Release on Merge

on:
  pull_request:
    branches:
      - master
    types:
      - closed
  workflow_dispatch:
    inputs:
      changelog_only:
        description: "Crear solo release notes/changelog (sin instalador)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: windows-release-master
  cancel-in-progress: false

jobs:
  release:
    name: Build Installer and Publish Release
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      REPO_DIR: source

    steps:
      - name: Checkout merged code (no external actions)
        shell: pwsh
        run: |
          $repoUrl = "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git clone --no-tags --depth 1 $repoUrl $env:REPO_DIR
          Set-Location $env:REPO_DIR
          git fetch --no-tags --depth 1 origin ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          git checkout --detach FETCH_HEAD

      - name: Resolve release mode
        id: mode
        shell: pwsh
        run: |
          $changelogOnly = 'false'
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.changelog_only }}' -eq 'true') {
            $changelogOnly = 'true'
          }
          "changelog_only=$changelogOnly" >> $env:GITHUB_OUTPUT

      - name: Install Flutter SDK (stable)
        shell: pwsh
        run: |
          $flutterDir = Join-Path $env:USERPROFILE 'flutter'
          if (-not (Test-Path (Join-Path $flutterDir 'bin\flutter.bat'))) {
            git clone https://github.com/flutter/flutter.git $flutterDir
          }
          Set-Location $flutterDir
          git fetch --depth 1 origin db50e20168
          git checkout --detach db50e20168
          (Join-Path $flutterDir 'bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Flutter version
        shell: pwsh
        run: flutter --version

      - name: Resolve version from pubspec
        id: version
        shell: pwsh
        working-directory: ${{ env.REPO_DIR }}
        run: |
          $line = Get-Content pubspec.yaml | Where-Object { $_ -match '^version:\s*' } | Select-Object -First 1
          if (-not $line) {
            throw 'No se encontro la linea version: en pubspec.yaml'
          }

          $rawVersion = ($line -replace '^version:\s*', '').Trim()
          $semver = $rawVersion.Split('+')[0].Trim()

          if ($semver -notmatch '^\d+\.\d+\.\d+([\-+][0-9A-Za-z\.-]+)?$') {
            throw "Version invalida en pubspec.yaml: $rawVersion"
          }

          "raw=$rawVersion" >> $env:GITHUB_OUTPUT
          "semver=$semver" >> $env:GITHUB_OUTPUT
          "tag=v$semver" >> $env:GITHUB_OUTPUT
          "installer_name=Folio-Setup-$semver" >> $env:GITHUB_OUTPUT

      - name: Ensure release tag does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release view $tag --repo '${{ github.repository }}' *> $null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            throw "Ya existe una release para $tag. Sube la version en pubspec.yaml antes de mergear."
          }

          # gh devuelve exit code 1 cuando la release no existe; ese caso es esperado aqui.
          $global:LASTEXITCODE = 0
          Write-Host "No existe release para $tag. Continuando."

      - name: Install dependencies
        if: steps.mode.outputs.changelog_only != 'true'
        working-directory: ${{ env.REPO_DIR }}
        shell: pwsh
        run: dart pub get --enforce-lockfile

      - name: Local secrets stub (gitignored file required for build)
        if: steps.mode.outputs.changelog_only != 'true'
        working-directory: ${{ env.REPO_DIR }}
        shell: pwsh
        run: Copy-Item -Force lib/config/folio_local_secrets.example.dart lib/config/folio_local_secrets.dart

      - name: Build Windows app
        if: steps.mode.outputs.changelog_only != 'true'
        working-directory: ${{ env.REPO_DIR }}
        shell: pwsh
        env:
          JIRA_OAUTH_CLIENT_SECRET: ${{ secrets.JIRA_OAUTH_CLIENT_SECRET }}
        run: |
          # Release estable oficial (merge a master): backend de produccion,
          # no el default de beta compilado en folio_local_secrets.dart.
          $backendDefine = '--dart-define=FOLIO_BACKEND_BASE_URL=https://backendfolio.minealexgames.com'
          if ($env:JIRA_OAUTH_CLIENT_SECRET -and $env:JIRA_OAUTH_CLIENT_SECRET.Trim().Length -gt 0) {
            flutter build windows --release --dart-define=FOLIO_DISTRIBUTION=github $backendDefine --dart-define=JIRA_OAUTH_CLIENT_SECRET=$env:JIRA_OAUTH_CLIENT_SECRET
          } else {
            flutter build windows --release --dart-define=FOLIO_DISTRIBUTION=github $backendDefine
          }

      - name: Install Inno Setup
        if: steps.mode.outputs.changelog_only != 'true'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build installer executable
        if: steps.mode.outputs.changelog_only != 'true'
        id: installer
        shell: pwsh
        working-directory: ${{ env.REPO_DIR }}
        env:
          WINDOWS_CODE_SIGN_PFX_BASE64: ${{ secrets.WINDOWS_CODE_SIGN_PFX_BASE64 }}
          WINDOWS_CODE_SIGN_PASSWORD: ${{ secrets.WINDOWS_CODE_SIGN_PASSWORD }}
        run: |
          $releaseDir = Resolve-Path 'build/windows/x64/runner/Release'
          if (-not (Test-Path $releaseDir)) {
            throw "No se encontro el directorio de salida: $releaseDir"
          }

          $distDir = (New-Item -ItemType Directory -Path (Join-Path $PWD 'dist') -Force).FullName
          $appVersion = '${{ steps.version.outputs.semver }}'
          $outputBase = '${{ steps.version.outputs.installer_name }}'
          $builder = Join-Path $PWD 'tool\windows\build_installer.ps1'

          $installerPath = & $builder `
            -RepoRoot $PWD `
            -SourceDir $releaseDir `
            -OutputDir $distDir `
            -AppVersion $appVersion `
            -OutputBase $outputBase

          if ($installerPath -is [array]) {
            $installerPath = ($installerPath | Where-Object { $_ -and "$_".Trim() } | Select-Object -Last 1)
          }
          $installerPath = "$installerPath".Trim()

          if (-not $installerPath -or -not (Test-Path -LiteralPath $installerPath)) {
            $installerPath = Join-Path $distDir "$outputBase.exe"
          }
          if (-not (Test-Path -LiteralPath $installerPath)) {
            throw "No se pudo generar el instalador esperado: $outputBase.exe"
          }

          "path=$installerPath" >> $env:GITHUB_OUTPUT

      - name: Publish GitHub release (with installer)
        if: steps.mode.outputs.changelog_only != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $installerPath = '${{ steps.installer.outputs.path }}'
          gh release create $tag $installerPath --repo '${{ github.repository }}' --target master --title $tag --generate-notes

      - name: Publish GitHub release (changelog only)
        if: steps.mode.outputs.changelog_only == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          gh release create $tag --repo '${{ github.repository }}' --target master --title $tag --generate-notes
